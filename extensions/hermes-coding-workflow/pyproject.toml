[build-system]
requires = ["setuptools>=68,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-coding-workflow"
version = "0.1.0"
description = "Contract-driven coding workflow control plane"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
hcw = "hermes_coding_workflow.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
hermes_coding_workflow = ["py.typed"]
